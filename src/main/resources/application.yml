server:
  # Railway injects PORT. Local runs stay on 8081.
  port: ${PORT:8081}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: FASHION_SESSION
        http-only: true
        same-site: ${SESSION_COOKIE_SAMESITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: fashion
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Used when DATABASE_URL is not set. Railway Postgres sets PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD.
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fashion}
    username: ${PGUSER:${DATABASE_USERNAME:postgres}}
    password: ${PGPASSWORD:${DATABASE_PASSWORD:Arunask@12}}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 8MB

fashion:
  frontend-origin: ${FASHION_FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:5502,http://127.0.0.1:5502}
  admin:
    email: ${FASHION_ADMIN_EMAIL:admin@fashion.com}
    password: ${FASHION_ADMIN_PASSWORD:admin@123}
  seed-demo: ${FASHION_SEED_DEMO:false}
  upload-dir: ${FASHION_UPLOAD_DIR:uploads}
  shipping:
    threshold: 2499.00
    fee: 99.00
  low-stock-threshold: 5
