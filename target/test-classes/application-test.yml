spring:
  datasource:
    url: jdbc:h2:mem:fashion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

fashion:
  frontend-origin: http://localhost:5173
  admin:
    email: admin@fashion.test
    password: AdminTest!23456
  seed-demo: false
  upload-dir: ${java.io.tmpdir}/fashion-uploads
  shipping:
    threshold: 2499.00
    fee: 99.00
  low-stock-threshold: 5
