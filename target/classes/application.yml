server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: FASHION_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: fashion
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Arunask@12}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 8MB

fashion:
  frontend-origin: ${FASHION_FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:5502,http://127.0.0.1:5502}
  admin:
    email: ${FASHION_ADMIN_EMAIL:admin@fashion.com}
    password: ${FASHION_ADMIN_PASSWORD:admin@123}
  seed-demo: ${FASHION_SEED_DEMO:false}
  upload-dir: ${FASHION_UPLOAD_DIR:uploads}
  shipping:
    threshold: 2499.00
    fee: 99.00
  low-stock-threshold: 5
