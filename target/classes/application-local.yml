# Local profile for machines without PostgreSQL.
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:file:./data/fashion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

fashion:
  frontend-origin: ${FASHION_FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    email: ${FASHION_ADMIN_EMAIL:admin@fashion.local}
    password: ${FASHION_ADMIN_PASSWORD:ChangeThisAdminPassword!23}
  seed-demo: false
